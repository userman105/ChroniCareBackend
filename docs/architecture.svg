<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 12px; fill: #0f172a; }
      .tb { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .ts { font-size: 10.5px; fill: #475569; }
      .h  { font-size: 14px; font-weight: 700; }
      .lbl{ font-size: 10.5px; fill: #1e293b; font-weight: 600; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .box { rx: 8; ry: 8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">ChroniCare — System Architecture</text>

  <!-- ===================== FLUTTER CLIENT ===================== -->
  <rect x="15" y="50" width="335" height="635" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="30" y="74" class="h" fill="#15803d">Flutter App · chronic_care</text>
  <text x="30" y="90" class="ts">Android · iOS · Web · Desktop targets — Dart ≥ 3.9.2</text>

  <rect class="box" x="30" y="102" width="305" height="76" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="122" class="tb">Presentation layer</text>
  <text x="42" y="140" class="t">Today · Insights · Reminders · Profile</text>
  <text x="42" y="156" class="t">Logs: BP · Glucose · Weight · Meds · Food ·</text>
  <text x="42" y="171" class="t">Symptoms · Lab tests · Appointments · PDF export</text>

  <rect class="box" x="30" y="192" width="305" height="66" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="212" class="tb">State management (flutter_bloc)</text>
  <text x="42" y="230" class="t">AuthCubit · HealthCubit (source of truth)</text>
  <text x="42" y="246" class="t">ThemeCubit · LocaleCubit (EN / AR, RTL)</text>

  <rect class="box" x="30" y="272" width="305" height="122" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="292" class="tb">Network &amp; sync services</text>
  <text x="42" y="310" class="t">ApiClient — Dio, Bearer injector,</text>
  <text x="42" y="325" class="t">auto refresh on 401 (retry once)</text>
  <text x="42" y="343" class="t">SyncService — offline queue, ≤5 retries,</text>
  <text x="42" y="358" class="t">drains on reconnect</text>
  <text x="42" y="376" class="t">ConnectivityService — polls /health every 15 s</text>
  <text x="42" y="389" class="ts">TokenStorage · AccountScopedStorage</text>

  <rect class="box" x="30" y="408" width="305" height="78" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="428" class="tb">Device services</text>
  <text x="42" y="446" class="t">NotificationService + AndroidAlarmManager</text>
  <text x="42" y="461" class="t">LabImageService (crop 1:1.414, resize, JPG q85)</text>
  <text x="42" y="476" class="t">PdfExportService (pdf + printing + open_filex)</text>

  <rect class="box" x="30" y="500" width="305" height="108" fill="#ecfccb" stroke="#65a30d"/>
  <text x="42" y="520" class="tb">On-device storage</text>
  <text x="42" y="538" class="t">flutter_secure_storage → access / refresh tokens</text>
  <text x="42" y="554" class="t">SharedPreferences → per-user namespaced cache</text>
  <text x="42" y="570" class="t">(BP, glucose, weight, meds, food, symptoms,</text>
  <text x="42" y="585" class="t">labs, appointments, reminders)</text>
  <text x="42" y="600" class="t">offline_sync_queue → pending writes</text>

  <text x="30" y="632" class="ts">Local-only today: meds, food, symptoms, appointments,</text>
  <text x="30" y="646" class="ts">reminders. Server-synced: BP, glucose, weight, lab uploads.</text>
  <text x="30" y="664" class="ts">GUEST_MODE build flag → runs fully offline, no account.</text>

  <!-- ===================== BACKEND ===================== -->
  <rect x="405" y="50" width="300" height="635" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420" y="74" class="h" fill="#1d4ed8">ChroniCareBackend</text>
  <text x="420" y="90" class="ts">Node.js · Express 5 · REST/JSON · :3000</text>

  <rect class="box" x="420" y="102" width="270" height="52" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="122" class="tb">app.js</text>
  <text x="432" y="139" class="t">CORS · JSON · GET /health · error handler</text>

  <rect class="box" x="420" y="166" width="270" height="62" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="186" class="tb">Routes</text>
  <text x="432" y="203" class="t">/api/auth/*  (public)</text>
  <text x="432" y="218" class="t">/api/user/*  (JWT or guest)</text>

  <rect class="box" x="420" y="240" width="270" height="76" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="260" class="tb">Middleware</text>
  <text x="432" y="277" class="t">auth — verify JWT → req.user / guest bypass</text>
  <text x="432" y="293" class="t">upload (Multer) — JPG/PNG, ≤ 5 MB,</text>
  <text x="432" y="308" class="t">unique filenames → /src/uploads</text>

  <rect class="box" x="420" y="328" width="270" height="64" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="348" class="tb">Controllers</text>
  <text x="432" y="365" class="t">auth: register · verify/resend OTP · login ·</text>
  <text x="432" y="380" class="t">logout · refresh · forgot/reset password</text>

  <rect class="box" x="420" y="404" width="270" height="62" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="424" class="tb">user controller + helpers</text>
  <text x="432" y="441" class="t">logs (BP/glucose/BMI) · diseases · allergies ·</text>
  <text x="432" y="456" class="t">lab tests · bcrypt · jsonwebtoken · otp.js</text>

  <rect class="box" x="420" y="478" width="270" height="48" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="432" y="498" class="tb">Prisma Client 6</text>
  <text x="432" y="514" class="t">typed queries · transactions · migrations</text>

  <rect class="box" x="420" y="538" width="270" height="54" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="558" class="tb">email.service (Nodemailer)</text>
  <text x="432" y="575" class="t">activation + password-reset OTP emails</text>

  <rect class="box" x="420" y="604" width="270" height="64" fill="#f1f5f9" stroke="#64748b"/>
  <text x="432" y="624" class="tb">Local disk · src/uploads/</text>
  <text x="432" y="641" class="t">lab-report images (path stored in DB)</text>
  <text x="432" y="656" class="ts">Not durable on ephemeral hosts</text>

  <!-- ===================== EXTERNAL ===================== -->
  <rect x="750" y="50" width="240" height="318" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="765" y="74" class="h" fill="#6d28d9">PostgreSQL</text>
  <text x="765" y="90" class="ts">via DATABASE_URL (Prisma)</text>
  <rect class="box" x="762" y="102" width="216" height="254" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="774" y="122" class="tb">Identity &amp; security</text>
  <text x="774" y="139" class="t">Users · UserOtp (hashed, 10 min)</text>
  <text x="774" y="154" class="t">UserSession (hashed refresh token</text>
  <text x="774" y="168" class="t">+ device fingerprint)</text>
  <text x="774" y="192" class="tb">Clinical data</text>
  <text x="774" y="209" class="t">BloodPressure · GlucoseLevels</text>
  <text x="774" y="224" class="t">HealthMetrics · LabTests</text>
  <text x="774" y="239" class="t">UserLogs (timeline) · Appointments</text>
  <text x="774" y="263" class="tb">Reference &amp; relations</text>
  <text x="774" y="280" class="t">Diseases (enum) · UserDisease</text>
  <text x="774" y="295" class="t">Allergies · UserAllergies</text>
  <text x="774" y="310" class="t">Medications · MedicationTypes</text>
  <text x="774" y="325" class="t">UserMedications · MedReminders</text>
  <text x="774" y="340" class="t">NutritionGuidelines</text>

  <rect x="750" y="388" width="240" height="112" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="765" y="412" class="h" fill="#b91c1c">OCR Service (FastAPI)</text>
  <text x="765" y="432" class="t">POST :8000/ocr  (multipart “file”)</text>
  <text x="765" y="448" class="t">→ { text, lines[] }</text>
  <text x="765" y="472" class="ts">Separate service — not in either repo.</text>
  <text x="765" y="487" class="ts">URL currently hard-coded to 127.0.0.1.</text>

  <rect x="750" y="520" width="240" height="96" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="765" y="544" class="h" fill="#c2410c">Gmail SMTP</text>
  <text x="765" y="562" class="t">smtp.gmail.com : 587 (STARTTLS)</text>
  <text x="765" y="578" class="t">Sends OTP codes to the user’s inbox</text>
  <text x="765" y="595" class="ts">EMAIL_USER / EMAIL_PASS</text>

  <!-- ===================== FLOWS ===================== -->
  <!-- Client -> Backend -->
  <path class="flow" d="M335 330 L405 330"/>
  <text x="370" y="320" text-anchor="middle" class="lbl">HTTP</text>
  <text x="370" y="346" text-anchor="middle" class="lbl">REST</text>
  <path class="flow" d="M405 215 L335 215" stroke-dasharray="4 3"/>
  <text x="370" y="208" text-anchor="middle" class="lbl">JSON</text>

  <!-- Prisma -> Postgres -->
  <path class="flow" d="M690 502 L726 502 L726 250 L750 250"/>
  <text x="722" y="300" text-anchor="end" class="lbl">SQL</text>

  <!-- user controller -> OCR -->
  <path class="flow" d="M690 436 L750 436"/>
  <text x="708" y="428" text-anchor="middle" class="lbl">image</text>

  <!-- email.service -> Gmail -->
  <path class="flow" d="M690 565 L750 565"/>
  <text x="720" y="557" text-anchor="middle" class="lbl">SMTP</text>

  <!-- footer legend -->
  <text x="500" y="694" text-anchor="middle" class="ts">Solid arrows: request path · Dashed: response / storage · Access token 15 min, refresh token 7 days (hashed in UserSession)</text>
</svg>
